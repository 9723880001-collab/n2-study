/* =========================================================================
   2. 安全 IndexedDB 缓存（永不阻塞页面、永不因无痕模式崩溃）
   ========================================================================= */
const DB_NAME = 'jlpt_n2_media_cache_v2';
const STORE_NAME = 'files';

function openMediaDb() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('no indexedDB'));
    const timer = setTimeout(() => reject(new Error('db timeout')), 2000);
    try {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        if (!req.result.objectStoreNames.contains(STORE_NAME)) req.result.createObjectStore(STORE_NAME);
      };
      req.onsuccess = () => { clearTimeout(timer); resolve(req.result); };
      req.onerror = () => { clearTimeout(timer); reject(req.error); };
    } catch (e) { clearTimeout(timer); reject(e); }
  });
}

async function dbPutFileSafe(key, fileObj) {
  try {
    const db = await openMediaDb();
    const buf = await fileObj.arrayBuffer();
    const blob = new Blob([buf], { type: fileObj.type || 'application/octet-stream' });
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      tx.objectStore(STORE_NAME).put({ name: fileObj.name, type: blob.type, size: fileObj.size, blob, savedAt: Date.now() }, key);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    return true;
  } catch (e) { return false; }
}

async function dbGetFileSafe(key) {
  try {
    const db = await openMediaDb();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function dbDeleteByPrefixSafe(prefix) {
  try {
    const db = await openMediaDb();
    await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.openCursor();
      req.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { if (String(c.key).startsWith(prefix)) c.delete(); c.continue(); }
      };
      tx.oncomplete = () => resolve();
      tx.onerror = () => resolve();
    });
  } catch (e) {}
}

async function dbListKeysSafe() {
  try {
    const db = await openMediaDb();
    return await new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).getAllKeys();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => resolve([]);
    });
  } catch (e) { return []; }
}

function loadJson(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { return fb; } }
function saveJsonSafe(k, val) { try { localStorage.setItem(k, JSON.stringify(val)); } catch (e) {} }

  tab: 'pdfroom',
  customPapers: loadJson(STORAGE_KEYS.CUSTOM_PAPERS, []),

function saveState() {
  saveJsonSafe(STORAGE_KEYS.CUSTOM_PAPERS, state.customPapers);
  saveJsonSafe(STORAGE_KEYS.MISTAKES, state.mistakes);
  saveJsonSafe(STORAGE_KEYS.HISTORY, state.history);
  saveJsonSafe(STORAGE_KEYS.PDF_SHEETS, state.pdfSheets);
  saveJsonSafe(STORAGE_KEYS.PDF_MISTAKES, state.pdfMistakes);
  updateMistakeBadges();
}

function getAllPapers() {
  const m = new Map();
  BUILTIN_PAPERS.forEach(p => m.set(p.id, { ...p, isBuiltin: true }));
  state.customPapers.forEach(p => m.set(p.id, { ...p, isCustom: true }));
  return Array.from(m.values());
}
function getPaperById(id) { return getAllPapers().find(p => p.id === id) || null; }
function getSessionLabel(id) { const s = TIMELINE_SESSIONS.find(x => x.id === id); return s ? s.label : id; }
function ensurePdfSheet(examId) {
  if (!state.pdfSheets[examId]) {
    const yr = parseInt(String(examId).slice(0, 4), 10);
    state.pdfSheets[examId] = { preset: (!isNaN(yr) && yr >= 2022) ? 'modern101' : 'legacy107', answers: {}, keyText: '', lastReport: null };
  }
  return state.pdfSheets[examId];
}
function updateMistakeBadges() {
  const total = Object.values(state.mistakes).filter(m => !m.mastered).length + Object.values(state.pdfMistakes).filter(m => !m.mastered).length;
  const b1 = document.getElementById('mistake-badge');
  const b2 = document.getElementById('mistake-badge-top');
  const b3 = document.getElementById('mistake-badge-mobile');
  if (b1) b1.textContent = total;
  if (b2) b2.textContent = total;
  if (b3) { b3.textContent = total; b3.classList.toggle('hidden', total === 0); }
}
function escapeHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function renderStemHtml(s) { return String(s ?? '').replace(/\n/g, '<br>'); }
function formatTime(sec) { const s = Math.max(0, Math.floor(sec)); return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`; }
function getCefrLabel(sc, ok) { return !ok ? '未达合格线' : (sc >= 112 ? 'CEFR B2' : (sc >= 90 ? 'CEFR B1' : '—')); }

/* =========================================================================
   5. 导航 & 渲染调度
   ========================================================================= */
function switchTab(tab) {
  stopTtsListening(false);
  if (state.quiz && state.quiz.timerId && tab !== 'quiz') { clearInterval(state.quiz.timerId); state.quiz.timerId = null; }
  state.tab = tab;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function openPdfExam(examId) {
  pdfRoom.examId = examId;
  pdfRoom.ab = { a: null, b: null, active: false };
  state.tab = 'pdfroom';
  render();
  showToast(`已打开 ${getSessionLabel(examId)} 模考室`);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateNavStyles() {
  const act = (state.tab === 'quiz' || state.tab === 'result') ? null : state.tab;
  ['pdfroom', 'predict', 'archive', 'mistakes', 'manage'].forEach(k => {
    const el = document.getElementById(`nav-${k}`);
    if (el) el.className = k === act
      ? 'px-3 py-2 rounded-lg font-medium bg-indigo-600 text-white shadow flex items-center gap-1'
      : 'px-3 py-2 rounded-lg font-medium text-slate-300 hover:bg-slate-800 hover:text-white flex items-center gap-1';
    const mel = document.getElementById(`mnav-${k}`);
    if (mel) mel.className = k === act
      ? 'relative flex flex-col items-center py-1 gap-0.5 text-indigo-600 font-bold'
      : 'relative flex flex-col items-center py-1 gap-0.5 text-slate-500';
  });
  const mb = document.getElementById('mobile-bottom-nav');
  if (mb) mb.classList.toggle('hidden', state.tab === 'quiz');
}

function render() {
  updateNavStyles();
  updateMistakeBadges();
  const root = document.getElementById('app-root');
  if (state.tab === 'pdfroom') {
    root.innerHTML = renderPdfRoomShell();
    // 同步立刻渲染答题卡，绝不等待 IndexedDB！
    renderOmrOnly();
    renderPdfGradeReport();
    updateKeyCountDisplay();
    setMobilePane(pdfRoom.mobilePane, false);
    // 异步静默恢复本机缓存的 PDF & MP3
    loadCachedMediaForExam(pdfRoom.examId);
  } else if (state.tab === 'predict') root.innerHTML = renderPredictView();
  else if (state.tab === 'archive') root.innerHTML = renderArchiveView();
  else if (state.tab === 'mistakes') root.innerHTML = renderMistakesView();
  else if (state.tab === 'manage') root.innerHTML = renderManageView();
  else if (state.tab === 'quiz') root.innerHTML = renderQuizView();
  else if (state.tab === 'result') root.innerHTML = renderResultView();
}

async function loadCachedMediaForExam(examId) {
  Object.values(pdfRoom.filesMeta).forEach(m => { if (m && m.blobUrl) URL.revokeObjectURL(m.blobUrl); });
  pdfRoom.filesMeta = {};
  pdfRoom.pdfDocs = {};
  pdfRoom.pageNums = { examPdf: 1, answerPdf: 1, scriptPdf: 1, transPdf: 1 };

  const slots = ['examPdf', 'audioMp3', 'answerPdf', 'scriptPdf', 'transPdf'];
  for (const slot of slots) {
    const rec = await dbGetFileSafe(`${examId}::${slot}`);
    if (pdfRoom.examId !== examId) return;
    if (rec && rec.blob) {
      pdfRoom.filesMeta[slot] = { name: rec.name, size: rec.size, blobUrl: URL.createObjectURL(rec.blob), blob: rec.blob };
      updateSlotBadge(slot, `✓ ${rec.name}`);
    } else {
      updateSlotBadge(slot, '点击选取文件');
    }
  }
  bindMp3Element();
  await loadAndRenderActivePdf();
}

function updateSlotBadge(slot, text) {
  const el = document.getElementById(`slot-status-${slot}`);
  if (el) el.textContent = text;
}

async function onChangePdfExam(newId) {
  pdfRoom.examId = newId;
  pdfRoom.ab = { a: null, b: null, active: false };
  const sheet = ensurePdfSheet(newId);
  const ps = document.getElementById('omr-preset-select'); if (ps) ps.value = sheet.preset;
  const kb = document.getElementById('omr-key-input'); if (kb) kb.value = sheet.keyText || '';
  renderOmrOnly();
  renderPdfGradeReport();
  updateKeyCountDisplay();
  showToast(`已切换至 ${getSessionLabel(newId)}`);
  await loadCachedMediaForExam(newId);
}

function onChangeOmrPreset(presetKey) {
  ensurePdfSheet(pdfRoom.examId).preset = presetKey;
  saveState(); renderOmrOnly(); updateKeyCountDisplay();
  showToast(`已切换答题卡：${OMR_PRESETS[presetKey].label}`);
}

async function onSelectExamMedia(slot, ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  // 先清 input value 以便下次还能重选同名文件
  ev.target.value = '';

  // 第1步：立刻内存装载显示/播放（0延迟，永不因缓存失败卡死！）
  if (pdfRoom.filesMeta[slot]?.blobUrl) URL.revokeObjectURL(pdfRoom.filesMeta[slot].blobUrl);
  const url = URL.createObjectURL(file);
  pdfRoom.filesMeta[slot] = { name: file.name, size: file.size, blobUrl: url, blob: file };
  updateSlotBadge(slot, `✓ ${file.name}`);

  if (slot === 'audioMp3') {
    bindMp3Element();
    showToast(`🎧 已装载听力：${file.name}`);
  } else {
    delete pdfRoom.pdfDocs[slot];
    pdfRoom.pageNums[slot] = 1;
    pdfRoom.activeDocSlot = slot;
    updateDocTabStyles();
    showToast(`📄 正在打开：${file.name}...`);
    await loadAndRenderActivePdf();
  }

  // 第2步：后台静默写入 IndexedDB 缓存
  dbPutFileSafe(`${pdfRoom.examId}::${slot}`, file).then(ok => {
    if (ok) refreshCachedKeys();
  });
}

async function loadAndRenderActivePdf() {
  const slot = pdfRoom.activeDocSlot;
  const meta = pdfRoom.filesMeta[slot];
  const emptyEl = document.getElementById('pdf-empty-hint');
  const canvas = document.getElementById('pdf-render-canvas');
  const totalEl = document.getElementById('pdf-page-total');
  const pageInput = document.getElementById('pdf-page-input');
  const rawLink = document.getElementById('pdf-raw-open');
  if (!canvas || !emptyEl) return;

  if (!meta) {
    canvas.classList.add('hidden');
    emptyEl.classList.remove('hidden');
    if (totalEl) totalEl.textContent = '0';
    if (pageInput) pageInput.value = '1';
    if (rawLink) rawLink.classList.add('hidden');
    return;
  }

  if (rawLink) { rawLink.href = meta.blobUrl; rawLink.classList.remove('hidden'); }

  if (!window.pdfjsLib) {
    emptyEl.innerHTML = `<div class="p-4 text-xs text-slate-700">当前网络未能加载 PDF 渲染组件，请点右上角「原文件」直接打开 PDF。</div>`;
    emptyEl.classList.remove('hidden'); canvas.classList.add('hidden'); return;
  }

  try {
    if (!pdfRoom.pdfDocs[slot]) {
      const buf = await meta.blob.arrayBuffer();
      pdfRoom.pdfDocs[slot] = await pdfjsLib.getDocument({
        data: buf,
        cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
        cMapPacked: true
      }).promise;
    }
    const doc = pdfRoom.pdfDocs[slot];
    const total = doc.numPages;
    const pNum = Math.max(1, Math.min(total, pdfRoom.pageNums[slot] || 1));
    pdfRoom.pageNums[slot] = pNum;

    if (totalEl) totalEl.textContent = String(total);
    if (pageInput) { pageInput.value = String(pNum); pageInput.max = String(total); }
    emptyEl.classList.add('hidden'); canvas.classList.remove('hidden');

    const seq = ++pdfRoom.renderSeq;
    const page = await doc.getPage(pNum);
    if (seq !== pdfRoom.renderSeq) return;

    const wrap = document.getElementById('pdf-canvas-wrap');
    const availW = Math.max(290, (wrap?.clientWidth || 350) - 20);
    const baseVp = page.getViewport({ scale: 1 });
    const fitScale = (availW / baseVp.width) * pdfRoom.scale;
    const dpr = Math.min(window.devicePixelRatio || 1, 2.0);
    const vp = page.getViewport({ scale: fitScale * dpr });

    canvas.width = Math.floor(vp.width);
    canvas.height = Math.floor(vp.height);
    canvas.style.width = Math.floor(vp.width / dpr) + 'px';
    canvas.style.height = Math.floor(vp.height / dpr) + 'px';

    await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  } catch (e) {
    emptyEl.innerHTML = `<div class="p-4 text-xs text-rose-600">PDF 渲染提示：${escapeHtml(e.message)}。请点右上角「原文件」直接查看。</div>`;
    emptyEl.classList.remove('hidden'); canvas.classList.add('hidden');
  }
}

}

/* ---------- 电子答题卡（OMR） ---------- */
function getActivePresetObj() { return OMR_PRESETS[ensurePdfSheet(pdfRoom.examId).preset] || OMR_PRESETS.legacy107; }

function renderOmrOnly() {
  const sheet = ensurePdfSheet(pdfRoom.examId);
  const preset = getActivePresetObj();
  const totalQ = preset.sections[preset.sections.length - 1].end;
  const filled = Object.keys(sheet.answers).filter(k => Number(k) <= totalQ).length;
  const progEl = document.getElementById('omr-progress-text');
  if (progEl) progEl.textContent = `已涂 ${filled} / ${totalQ} 题`;

  const tabEl = document.getElementById('omr-sec-tabs');
  if (tabEl) {
    tabEl.innerHTML = preset.sections.map(sec => {
      let cnt = 0; for (let i = sec.start; i <= sec.end; i++) if (sheet.answers[i]) cnt++;
      const act = pdfRoom.omrSection === sec.name;
      return `<button type="button" onclick="switchOmrSection('${sec.name}')" class="py-1.5 px-1 rounded-lg border ${act ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-700 border-slate-200'}"><div>${sec.name}</div><div class="text-[10px] opacity-80">${cnt}/${sec.end - sec.start + 1}</div></button>`;
    }).join('');
  }

  const gridEl = document.getElementById('omr-grid-container');
  const curSec = preset.sections.find(s => s.name === pdfRoom.omrSection) || preset.sections[0];
  if (!gridEl || !curSec) return;

  const rep = sheet.lastReport;
  const keys = parseAnswerKey(sheet.keyText || '', totalQ);
  let html = '';
  for (let qNo = curSec.start; qNo <= curSec.end; qNo++) {
    const isThree = curSec.threeChoiceRange && qNo >= curSec.threeChoiceRange[0] && qNo <= curSec.threeChoiceRange[1];
    const maxOpt = isThree ? 3 : 4;
    const picked = sheet.answers[qNo];
    const correct = rep ? keys[qNo - 1] : null;
    const isW = rep && correct && picked !== correct;
    const isR = rep && correct && picked === correct;

    html += `
      <div class="flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl border ${isW ? 'border-rose-300 bg-rose-50/70' : (isR ? 'border-emerald-200 bg-emerald-50/40' : 'border-slate-100 bg-slate-50/50')}">
        <div class="flex items-center gap-1 min-w-[66px]">
          <span class="text-xs font-bold ${isW ? 'text-rose-700' : 'text-slate-700'}">第 ${qNo} 题</span>
          ${isThree ? '<span class="text-[9px] px-1 rounded bg-sky-100 text-sky-700">3选</span>' : ''}
        </div>
        <div class="flex items-center gap-1.5">
          ${[1, 2, 3, 4].slice(0, maxOpt).map(opt => {
            const sel = picked === opt;
            const isAns = rep && correct === opt;
            let cls = 'bg-white border-slate-300 text-slate-700';
            if (sel && isW) cls = 'bg-rose-600 border-rose-600 text-white font-bold';
            else if (sel) cls = 'bg-indigo-600 border-indigo-600 text-white font-bold';
            else if (isAns) cls = 'bg-emerald-100 border-emerald-500 text-emerald-800 font-bold';
            return `<button type="button" onclick="pickOmr(${qNo}, ${opt})" class="w-9 h-8 rounded-lg border text-xs ${cls}">${opt}</button>`;
          }).join('')}
        </div>
        ${isW ? `<span class="text-[11px] font-bold text-emerald-700 shrink-0">正:${correct}</span>` : (isR ? '<span class="text-xs text-emerald-600 shrink-0">✓</span>' : '<span class="w-5"></span>')}
      </div>`;
  }
  gridEl.innerHTML = html;
}

function switchOmrSection(name) { pdfRoom.omrSection = name; renderOmrOnly(); }
function pickOmr(qNo, opt) {
  const sheet = ensurePdfSheet(pdfRoom.examId);
  if (sheet.answers[qNo] === opt) delete sheet.answers[qNo]; else sheet.answers[qNo] = opt;
  saveState(); renderOmrOnly();
}
function clearCurrentOmrAnswers() {
  if (!confirm('清空本期所有涂卡记录？')) return;
  const s = ensurePdfSheet(pdfRoom.examId); s.answers = {}; s.lastReport = null; saveState();
  renderOmrOnly(); renderPdfGradeReport(); showToast('已清空本期涂卡');
}
function parseAnswerKey(raw, maxLen) {
  if (!raw || !raw.trim()) return [];
  const numbered = [...raw.matchAll(/(?:^|[\s,;，；])(?:\(?\d{1,3}\)?[\.\、\:\-\)\s]+?)([1-4])(?=$|[\s,;，；])/g)];
  if (numbered.length >= 5) return numbered.map(m => parseInt(m[1], 10)).slice(0, maxLen);
  return (raw.match(/[1-4]/g) || []).map(d => parseInt(d, 10)).slice(0, maxLen);
}
function onEditAnswerKey(val) { ensurePdfSheet(pdfRoom.examId).keyText = val; saveState(); updateKeyCountDisplay(); }
function updateKeyCountDisplay() {
  const sheet = ensurePdfSheet(pdfRoom.examId);
  const totalQ = getActivePresetObj().sections.slice(-1)[0].end;
  const el = document.getElementById('key-parse-count');
  if (el) el.textContent = `已识别 ${parseAnswerKey(sheet.keyText || '', totalQ).length} / ${totalQ} 题`;
}

function gradePdfExam() {
  const sheet = ensurePdfSheet(pdfRoom.examId);
  const preset = getActivePresetObj();
  const totalQ = preset.sections.slice(-1)[0].end;
  const keys = parseAnswerKey(sheet.keyText || '', totalQ);
  if (!keys.length) return showToast('请先在上方粘贴标准答案数字（如 1324...）', 3200);

  const major = { '言語知識': { c: 0, t: 0 }, '読解': { c: 0, t: 0 }, '聴解': { c: 0, t: 0 } };
  const wrongList = []; let checked = 0; let right = 0;

  preset.sections.forEach(sec => {
    for (let qNo = sec.start; qNo <= sec.end; qNo++) {
      const ans = keys[qNo - 1]; if (!ans) continue;
      checked++; major[sec.major].t++;
      const picked = sheet.answers[qNo];
      if (picked === ans) { right++; major[sec.major].c++; }
      else {
        wrongList.push({ qNo, section: sec.name, userAns: picked || null, correctAns: ans });
        const mk = `${pdfRoom.examId}::${qNo}`;
        state.pdfMistakes[mk] = {
          examId: pdfRoom.examId, examLabel: getSessionLabel(pdfRoom.examId),
          qNo, section: sec.name, userAns: picked || null, correctAns: ans,
          note: state.pdfMistakes[mk]?.note || '', mastered: false, updatedAt: Date.now()
        };
      }
    }
  });

  const rate = checked ? right / checked : 0;
  const lang = major['言語知識'].t ? Math.round((major['言語知識'].c / major['言語知識'].t) * 60) : Math.round(rate * 60);
  const read = major['読解'].t ? Math.round((major['読解'].c / major['読解'].t) * 60) : Math.round(rate * 60);
  const listen = major['聴解'].t ? Math.round((major['聴解'].c / major['聴解'].t) * 60) : Math.round(rate * 60);
  const totalScaled = lang + read + listen;
  const passed = totalScaled >= 90 && lang >= 19 && read >= 19 && listen >= 19;

  sheet.lastReport = { totalChecked: checked, totalCorrect: right, accuracy: Math.round(rate * 100), lang, read, listen, totalScaled, passed, cefr: getCefrLabel(totalScaled, passed), wrongList };
  saveState(); renderOmrOnly(); renderPdfGradeReport();
  showToast(`评分完成：${totalScaled}/180 (${sheet.lastReport.cefr})，错 ${wrongList.length} 题`);
}

function renderPdfGradeReport() {
  const wrap = document.getElementById('pdf-grade-report'); if (!wrap) return;
  const r = ensurePdfSheet(pdfRoom.examId).lastReport;
  if (!r) { wrap.innerHTML = ''; return; }
  wrap.innerHTML = `
    <div class="mt-2 p-3.5 rounded-2xl border-2 ${r.passed ? 'border-emerald-300 bg-emerald-50/60' : 'border-rose-300 bg-rose-50/60'} space-y-2.5">
      <div class="flex items-center justify-between gap-2">
        <div>

          <div class="text-xl font-extrabold text-slate-900">${r.totalScaled} <span class="text-xs font-normal text-slate-500">/180分</span></div>

const audioState = { playingQId: null, rate: 1.0, showScript: {}, voices: [], speechSupported: 'speechSynthesis' in window };
function loadJaVoices() { if (audioState.speechSupported) audioState.voices = (window.speechSynthesis.getVoices() || []).filter(v => (v.lang || '').toLowerCase().startsWith('ja')); }
if (audioState.speechSupported) { loadJaVoices(); window.speechSynthesis.onvoiceschanged = loadJaVoices; }
function stopTtsListening(re = false) { if (audioState.speechSupported) window.speechSynthesis.cancel(); audioState.playingQId = null; if (re) render(); }
function findQuestionById(qId) {
  if (state.quiz) { const f = state.quiz.paper.questions.find(q => q.id === qId); if (f) return f; }
  if (state.lastResult) { const f = state.lastResult.items.find(i => i.q.id === qId); if (f) return f.q; }
  if (state.mistakes[qId]) return state.mistakes[qId].question;
  for (const p of getAllPapers()) { const f = p.questions.find(q => q.id === qId); if (f) return f; }
  return null;
}
function togglePlayTts(qId) {
  if (audioState.playingQId === qId) return stopTtsListening(true);
  const q = findQuestionById(qId); if (!q || !Array.isArray(q.dialogue)) return;
  if (!audioState.speechSupported) return showToast('请在 Safari/Chrome 浏览器中打开以播放语音', 3000);
  stopTtsListening(false); loadJaVoices(); audioState.playingQId = qId; render(); speakTtsLine(q, 0);
}
function speakTtsLine(q, idx) {
  if (audioState.playingQId !== q.id) return;
  if (idx >= q.dialogue.length) { audioState.playingQId = null; render(); return; }
  const line = q.dialogue[idx];
  const st = document.getElementById(`listen-status-${q.id}`); if (st) st.textContent = `正在朗读 (${idx+1}/${q.dialogue.length})：${line.speaker}`;
  const u = new SpeechSynthesisUtterance(line.text); u.lang = 'ja-JP'; u.rate = audioState.rate;
  if (audioState.voices.length) u.voice = audioState.voices[0];
  u.pitch = line.speaker === '男' ? 0.85 : (line.speaker === '女' ? 1.15 : 1.0);
  u.onend = () => { if (audioState.playingQId === q.id) setTimeout(() => speakTtsLine(q, idx + 1), 350); };
  u.onerror = () => stopTtsListening(true);
  window.speechSynthesis.speak(u);
}
function setTtsRate(r) { audioState.rate = r; const id = audioState.playingQId; if (id) { stopTtsListening(false); togglePlayTts(id); } else render(); }
function toggleTtsScript(qId) { audioState.showScript[qId] = !audioState.showScript[qId]; render(); }

function renderTtsPlayer(q, isReview = false) {
  const playing = audioState.playingQId === q.id;
  const open = isReview || !!audioState.showScript[q.id];
  return `
    <div class="mb-4 rounded-2xl border-2 ${playing ? 'border-indigo-500 bg-indigo-50/70' : 'border-indigo-200 bg-indigo-50/40'} p-3.5">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-3">
          <button type="button" onclick="togglePlayTts('${q.id}')" class="w-11 h-11 rounded-full text-white font-bold shadow ${playing ? 'bg-rose-600' : 'bg-indigo-600'}">${playing ? '⏹' : '▶'}</button>
          <div>
            <div class="font-bold text-sm text-indigo-950">🎧 日语听力播放器</div>
            <div id="listen-status-${q.id}" class="text-xs text-indigo-700">${playing ? '正在朗读...' : '点左侧按钮收听日语对话（关闭手机静音）'}</div>
          </div>
        </div>
        <div class="flex gap-1 text-xs">
          ${[0.8, 1.0, 1.15].map(r => `<button type="button" onclick="setTtsRate(${r})" class="px-2 py-1 rounded-lg border font-semibold ${audioState.rate === r ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-600 border-slate-200'}">${r}x</button>`).join('')}
        </div>
      </div>
      ${q.listeningIntro ? `<div class="mt-2 text-xs bg-white/80 rounded-lg px-3 py-1.5 border border-indigo-100 jp-text"><strong>场景：</strong>${escapeHtml(q.listeningIntro)}</div>` : ''}
      ${!isReview ? `<div class="mt-2 text-right"><button type="button" onclick="toggleTtsScript('${q.id}')" class="text-xs text-indigo-700 font-semibold">${open ? '隐藏原文' : '📄 临时看台本'}</button></div>` : ''}
      ${open && Array.isArray(q.dialogue) ? `
        <div class="mt-2 p-3 rounded-xl bg-white border border-indigo-100 space-y-1 text-xs sm:text-sm">
          ${q.dialogue.map(l => `<div class="jp-text"><strong class="${l.speaker==='男'?'text-blue-700':(l.speaker==='女'?'text-rose-600':'text-slate-500')}">${escapeHtml(l.speaker)}：</strong>${escapeHtml(l.text)}</div>`).join('')}
          ${isReview && q.translation ? `<div class="mt-2 pt-2 border-t border-slate-100 text-xs text-slate-600 whitespace-pre-line">${escapeHtml(q.translation)}</div>` : ''}
        </div>` : ''}
    </div>`;
}

  qs.forEach((q, idx) => {
    const u = qz.answers[q.id]; const ok = u === q.answer; if (ok) totalCorrect++;
    const mk = (q.section === '文字・語彙' || q.section === '文法') ? '言語知識' : (q.section === '聴解' ? '聴解' : '読解');
    major[mk].t++; if (ok) major[mk].c++;
    const rec = { q, index: idx + 1, userChoice: u, isCorrect: ok }; items.push(rec);
    if (!ok) {
      wrongItems.push(rec);
      const prev = state.mistakes[q.id];
      state.mistakes[q.id] = { question: q, paperId: qz.paper.id, paperTitle: qz.paper.title, wrongCount: prev ? prev.wrongCount + 1 : 1, lastWrongChoice: u, mastered: false, updatedAt: Date.now() };
    } else if (qz.mode === 'retry' && state.mistakes[q.id]) state.mistakes[q.id].mastered = true;
  });
  const rate = qs.length ? totalCorrect / qs.length : 0;
  const lang = major['言語知識'].t ? Math.round((major['言語知識'].c / major['言語知識'].t) * 60) : Math.round(rate * 60);
  const read = major['読解'].t ? Math.round((major['読解'].c / major['読解'].t) * 60) : Math.round(rate * 60);
  const listen = major['聴解'].t ? Math.round((major['聴解'].c / major['聴解'].t) * 60) : Math.round(rate * 60);
  const totalScaled = lang + read + listen;
  const passed = totalScaled >= 90 && lang >= 19 && read >= 19 && listen >= 19;
  if (qz.mode !== 'retry') {
    const old = state.history[qz.paper.id];
    state.history[qz.paper.id] = { bestScaled: old ? Math.max(old.bestScaled, totalScaled) : totalScaled, bestPassed: old ? (old.bestPassed || passed) : passed };
  }
  saveState();
  state.lastResult = { paper: qz.paper, totalCorrect, totalQuestions: qs.length, accuracy: Math.round(rate * 100), lang, read, listen, totalScaled, passed, cefr: getCefrLabel(totalScaled, passed), items, wrongItems };
  state.resultFilter = wrongItems.length ? 'wrong' : 'all';
  state.quiz = null; state.tab = 'result'; render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderResultView() {
  const r = state.lastResult; if (!r) return '';
  const list = state.resultFilter === 'wrong' ? r.wrongItems : r.items;
  return `
    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-wrap items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-24 h-24 rounded-full border-8 flex flex-col items-center justify-center shrink-0 ${r.passed ? 'border-emerald-500 bg-emerald-50 text-emerald-800' : 'border-rose-500 bg-rose-50 text-rose-800'}">
            <div class="text-2xl font-extrabold">${r.totalScaled}</div><div class="text-[11px]">/180分</div>
          </div>
          <div>
            <div class="flex flex-wrap gap-1.5 mb-1">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${r.passed?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}">${r.passed?'✓ 预计合格':'✗ 未达合格线'}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800">${r.cefr}</span>
            </div>
            <h2 class="font-bold text-slate-900">${escapeHtml(r.paper.title)}</h2>
            <p class="text-xs text-slate-600 mt-0.5">对 ${r.totalCorrect}/${r.totalQuestions} (${r.accuracy}%) · 错 ${r.wrongItems.length} 题 · 言語${r.lang}/読解${r.read}/聴解${r.listen}</p>
          </div>
        </div>
        <div class="flex gap-2">
          <button type="button" onclick="switchTab('mistakes')" class="px-3.5 py-2 rounded-xl bg-slate-900 text-white text-xs font-semibold">📕 错题集</button>
          <button type="button" onclick="switchTab('predict')" class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold">返回列表</button>
        </div>
      </div>
      <div class="flex items-center justify-between bg-white rounded-xl border border-slate-200 p-3.5">
        <h3 class="font-bold text-sm">🔍 错题与四选项知识点拆解</h3>
        <div class="flex gap-1.5 text-xs">
          <button type="button" onclick="state.resultFilter='wrong';render()" class="px-3 py-1.5 rounded-lg font-semibold ${state.resultFilter==='wrong'?'bg-rose-600 text-white':'bg-slate-100'}">仅错题(${r.wrongItems.length})</button>
          <button type="button" onclick="state.resultFilter='all';render()" class="px-3 py-1.5 rounded-lg font-semibold ${state.resultFilter==='all'?'bg-indigo-600 text-white':'bg-slate-100'}">全部(${r.items.length})</button>
        </div>
      </div>
      <div class="space-y-4">
        ${list.map(i => renderDetailedQuestionCard({ q: i.q, indexLabel: `第 ${i.index} 题`, userChoice: i.userChoice, sourceLabel: i.isCorrect ? '答对' : '做错', isCorrect: i.isCorrect })).join('')}
      </div>
    </div>`;
}

function renderDetailedQuestionCard({ q, indexLabel, userChoice, sourceLabel, isCorrect = false, mistakeControls = null }) {
  return `
    <article class="bg-white rounded-2xl border-2 ${isCorrect ? 'border-emerald-200' : 'border-rose-200'} shadow-sm overflow-hidden">
      <div class="px-4 py-2.5 flex flex-wrap justify-between gap-2 ${isCorrect ? 'bg-emerald-50/70' : 'bg-rose-50/70'} border-b border-slate-100 text-xs">
        <div><span class="px-2 py-0.5 rounded font-bold text-white ${isCorrect?'bg-emerald-600':'bg-rose-600'}">${escapeHtml(indexLabel)}</span> <strong>${escapeHtml(q.section)} · ${escapeHtml(q.qType)}</strong></div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="px-2 py-0.5 rounded ${isCorrect?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'} font-bold">选：${userChoice===undefined?'未答':`选项${userChoice+1}`}</span>
          <span class="px-2 py-0.5 rounded bg-emerald-600 text-white font-bold">正：选项${q.answer+1}</span>
          ${mistakeControls ? `<button type="button" onclick="toggleMistakeMastered('${mistakeControls.qId}')" class="px-2 py-0.5 rounded border bg-white">${mistakeControls.mastered?'✓已掌握':'标掌握'}</button><button type="button" onclick="deleteMistake('${mistakeControls.qId}')" class="text-slate-400">删</button>` : ''}
        </div>
      </div>
      <div class="p-4 space-y-3">
        ${q.section === '聴解' ? renderTtsPlayer(q, true) : ''}
        ${q.passage ? `<div class="jp-text p-3 rounded-xl bg-amber-50/50 border border-amber-200 text-xs sm:text-sm whitespace-pre-line">${escapeHtml(q.passage)}</div>` : ''}
        <div class="jp-text font-semibold text-slate-900">${renderStemHtml(q.stem)}</div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2.5">
          ${q.options.map((opt, idx) => {
            const isAns = idx === q.answer; const isW = !isAns && idx === userChoice;
            return `<div class="p-3 rounded-xl border ${isAns?'border-emerald-400 bg-emerald-50/70':(isW?'border-rose-400 bg-rose-50/70':'border-slate-200 bg-slate-50/60')}">
              <div class="flex justify-between gap-2 mb-1"><span class="jp-text font-bold text-sm">${idx+1}. ${renderStemHtml(opt.text)}</span><span class="px-1.5 py-0.5 rounded text-[10px] font-bold shrink-0 ${isAns?'bg-emerald-600 text-white':(isW?'bg-rose-600 text-white':'bg-slate-200 text-slate-600')}">${isAns?'✓正解':(isW?'✗误选':'干扰')}</span></div>
              <div class="text-[11px] font-semibold text-indigo-700">考点：${escapeHtml(opt.tag||'')}</div>
              <p class="text-xs text-slate-700 mt-0.5">${escapeHtml(opt.detail||'')}</p>
            </div>`;
          }).join('')}
        </div>
        ${q.explanation ? `<div class="p-3 rounded-xl bg-indigo-50/70 text-xs"><strong>💡 解析：</strong>${escapeHtml(q.explanation)}</div>` : ''}
      </div>
    </article>`;
}

function renderManageView() {
  return `
    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
        <h2 class="text-lg font-bold text-slate-900">⚙️ 题库导入 & 学习记录备份</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div class="p-4 rounded-xl bg-indigo-50/60 border border-indigo-200">
            <div class="text-xs font-bold text-indigo-900">1. 导入 JSON 题库</div>
            <div class="text-xs text-slate-600 mt-1">已导入：${state.customPapers.length} 套</div>
            <button type="button" onclick="openImportModal(null)" class="mt-3 w-full py-2.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">打开导入框</button>
          </div>
          <div class="p-4 rounded-xl bg-slate-50 border border-slate-200">
            <div class="text-xs font-bold">2. 导出学习记录备份</div>
            <div class="text-xs text-slate-600 mt-1">含错题与答题卡成绩</div>
            <button type="button" onclick="exportAllBackup()" class="mt-3 w-full py-2.5 rounded-lg bg-slate-900 text-white text-xs font-semibold">⬇️ 导出备份</button>
          </div>
          <div class="p-4 rounded-xl bg-emerald-50/60 border border-emerald-200">
            <div class="text-xs font-bold text-emerald-900">3. 恢复其他设备备份</div>
            <div class="text-xs text-slate-600 mt-1">导入备份 .json</div>
            <div class="file-btn-wrap mt-3 w-full py-2.5 rounded-lg bg-emerald-600 text-white text-xs font-semibold text-center">
              <span>📂 选择备份文件</span>
              <input type="file" class="file-btn-input" onchange="importAllBackup(event)" />
            </div>
          </div>
        </div>
      </div>
      <div class="bg-white rounded-2xl border border-rose-200 p-4 flex items-center justify-between">
        <span class="text-sm font-bold text-rose-700">清空本地所有记录</span>
        <button type="button" onclick="resetAllLocalData()" class="px-4 py-2 rounded-xl border border-rose-300 text-rose-600 text-xs font-semibold">一键清空</button>
      </div>
    </div>`;
}

function openImportModal(id) { state.importTargetId = id; document.getElementById('import-error').classList.add('hidden'); document.getElementById('json-textarea').value = ''; document.getElementById('import-modal').classList.remove('hidden'); }
function closeImportModal() { document.getElementById('import-modal').classList.add('hidden'); }
function handleJsonFileUpload(ev) { const f = ev.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = () => { document.getElementById('json-textarea').value = r.result; }; r.readAsText(f, 'UTF-8'); }
function confirmImportJson() {
  const raw = document.getElementById('json-textarea').value.trim(); const err = document.getElementById('import-error'); err.classList.add('hidden');
  try {
    const parsed = JSON.parse(raw); const list = Array.isArray(parsed) ? parsed : [parsed];
    for (const p of list) {
      if (!p.id || !p.title || !Array.isArray(p.questions) || !p.questions.length) throw new Error('格式需含 id/title/questions');
      const i = state.customPapers.findIndex(x => x.id === p.id); if (i >= 0) state.customPapers[i] = p; else state.customPapers.push(p);
    }
    saveState(); closeImportModal(); render(); showToast(`✅ 成功导入 ${list.length} 套试卷！`);
  } catch (e) { err.textContent = '导入失败：' + e.message; err.classList.remove('hidden'); }
}
function downloadJsonTemplate() { triggerDownload(JSON.stringify(BUILTIN_PAPERS[0], null, 2), 'jlpt-n2-sample.json'); }
function exportAllBackup() {
  triggerDownload(JSON.stringify({ exportedAt: new Date().toISOString(), customPapers: state.customPapers, mistakes: state.mistakes, history: state.history, pdfSheets: state.pdfSheets, pdfMistakes: state.pdfMistakes }, null, 2), `jlpt-n2-backup-${new Date().toISOString().slice(0,10)}.json`);
}
function importAllBackup(ev) {
  const f = ev.target.files?.[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.customPapers) state.customPapers = d.customPapers;
      if (d.mistakes) state.mistakes = d.mistakes;
      if (d.history) state.history = d.history;
      if (d.pdfSheets) state.pdfSheets = d.pdfSheets;
      if (d.pdfMistakes) state.pdfMistakes = d.pdfMistakes;
      saveState(); render(); showToast('✅ 已成功恢复全部备份记录！');
    } catch (e) { showToast('备份文件格式有误：' + e.message, 3000); }
  };
  r.readAsText(f, 'UTF-8');
}
function triggerDownload(content, filename) {
  const url = URL.createObjectURL(new Blob([content], { type: 'application/json;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = filename; a.click(); URL.revokeObjectURL(url);
}
function resetAllLocalData() {
  if (!confirm('确定清空本地所有涂卡、错题与导入试卷吗？')) return;
  state.customPapers = []; state.mistakes = {}; state.history = {}; state.pdfSheets = {}; state.pdfMistakes = {};
  saveState(); render(); showToast('已清空全部本地记录');
}

async function refreshCachedKeys() {
  state.cachedDbKeys = await dbListKeysSafe();
  if (state.tab === 'archive') render();
}

// 立即同步首屏渲染，绝不等待 IndexedDB！
render();
refreshCachedKeys();
</script>
</body>
