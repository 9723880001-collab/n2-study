  ["R11",2,"問題11 中文理解 (6/7)","文章の<u>ちょっとした手間</u>とは、具体的に何を指しているか。",["料理をできるだけ安く早く提供する工夫。","全国どこの店でも同じ味を守るマニュアル作り。","常連客の好みや気候に合わせて温かいお茶を多めに入れるなどの気配り。","新しい客を増やすための宣伝活動。"],["连锁店特点","连锁店特点","正解：紧邻前文举例内容","无中生有"],2,"指示代词/划线词题必看紧挨着的前一句举例！","r11c"],
  ["R12",2,"問題11 中文理解 (7/7)","筆者がこの文章で最も伝えたいことは何か。",["チェーン店は機械的なので利用をやめるべきだ。","小さな食堂も効率化のためマニュアルを導入すべきだ。","接客の質より料理の味と安さが一番大切だ。","効率では無駄に見える人ならではの気配りにこそ特別な価値がある。"],["过度极端","与作者主张相反","偏离重心","正解：命中末句「その気配りこそが～価値を生み出している」"],3,"锁定末句「～こそが～価値を生み出している」。","r11c"],
  ["R13",2,"問題12 統合理解 (1/2)","文章Aと文章Bのどちらにも共通して述べられている点は何か。",["災害時に使えなくなる危険があること。","支出を管理しやすくなること。","キャッシュレス決済には手軽さや便利さがあること。","普段から一定額の現金を持つべきであること。"],["仅B提及","仅A提及(B相反)","正解：A说非常に便利だ、B也承认手軽だが/便利さに","仅B提及"],2,"共同点题划去单边信息，留下双边共识！","r12"],
  ["R14",2,"問題12 統合理解 (2/2)","支出の管理について、文章Aと文章Bの考え方の違いとして正しいものはどれか。",["Aは履歴が残り管理しやすいと述べ、Bは現金感覚がなく使いすぎやすいと述べている。","AもBもアプリを使えば必ず節約できると述べている。","Aは使いすぎの危険を指摘し、Bは家計簿の代わりになると述べている。","AもBも支出の管理には現金払いのほうが適していると述べている。"],["正解：精准对应A与B在开支管理上的正反观点","B相反","A与B颠倒","A相反"],0,"直接对比A第二句与B第一句。","r12"],
  ["R15",2,"問題13 長文理解 (1/3)","筆者が「効率の面でかなわないのは当然だ」と述べている理由は何か。",["街の書店は営業時間が短く品数が少ないから。","ネット書店は検索ですぐ見つかり自宅まで届けてくれるから。","ネット書店のほうが本の値段が圧倒的に安いから。","街の書店では店主と話すのに時間がかかるから。"],["未提营业时间","正解：对应第一段「検索すれば～自宅まで届けてくれるのだから」","未提价格","无中生有"],1,"找「～のだから」原因说明句。","r13"],
  ["R16",2,"問題13 長文理解 (2/3)","ネット書店の推薦機能について、筆者はどんな問題点を挙げているか。",["過去の履歴に似た本ばかり表示され、興味の範囲が狭くなりやすいこと。","欲しい本を検索してもなかなか見つからないこと。","自分の好みとまったく無関係な本ばかり勧められること。","実店舗より新刊の情報が遅れて表示されること。"],["正解：精准对应第二段","与第一段相反","与似た傾向の本相反","无中生有"],0,"回第二段定位「ネットの推薦機能」。","r13"],
  ["R17",2,"問題13 長文理解 (3/3)","筆者がこの文章で最も伝えたいことは何か。",["ネット書店は不便なので今後は利用を控えるべきだ。","小さな書店は効率でネットに勝つよう工夫すべきだ。","偶然の出会いや交流を生む街の書店の価値を見直し、訪れてみてほしい。","過去の購入履歴を消去すれば新しい本に出会える。"],["极端曲解","作者认为价值不在效率","正解：精准概括末段呼吁「足を運んでみてはどうだろうか」","无中生有"],2,"长文主旨看结尾呼吁「～てみてはどうだろうか」。","r13"],

  ["L01",3,"聴解 問題1 課題理解 (1/5)","女の社員はこれからまず何をしますか。",["会議室を予約する","資料をコピーする","資料のグラフを修正する","飲み物を注文する"],["男方已完成","女方说放后面(そのあと)","正解：部长要求先换最新图表","傍晚前就行"],2,"排除已完成/延后/不急，锁定最优先事项。",{"intro":"会社で女の社員と男の社員が会議の準備について話しています。","dlg":[["ナレーター","会社で社員2人が会議の準備を話しています。女の社員はこれからまず何をしますか。"],["女","明日の会議の準備、進んでいますか。"],["男","会議室の予約は終わりましたよ。"],["女","じゃあ、資料をコピーしておきますね。"],["男","あ、部長から3ページ目のグラフを最新データに差し替えてほしいって連絡があったんです。あと飲み物の注文は夕方までで大丈夫です。"],["女","じゃあコピーはそのあとですね。急いでグラフから直します！"]],"tr":"预约已完成；原打算先复印但部长要求先替换第3页图表；订饮料傍晚前就行。"}],
  ["L02",3,"聴解 問題1 課題理解 (2/5)","女の職員はこれからまず何をしますか。",["参加者にメールを送る","弁当屋に配達場所の変更を電話する","公園にテントを立てる","体育館へ看板を運ぶ"],["已交田中负责","正解：下午3点截止必须先打","大雨取消改体育馆","明早再运"],1,"抓住截止时间「午後3時が締切」与「まずは～急いで」。",{"intro":"市役所の職員2人が明日の雨天対応を話しています。","dlg":[["ナレーター","職員2人が明日のイベントを話しています。女の職員はこれからまず何をしますか。"],["女","明日は大雨予報ですね。体育館に変更ですか。すぐ参加者にメールを送ります。"],["男","メールは田中くんに頼んだよ。それより弁当屋に配達場所変更の電話をしてくれる？午後3時締切なんだ。看板は明日の朝運べばいいよ。"],["女","分かりました、すぐ電話します！"]],"tr":"邮件交给田中；盒饭改地址3点截止最急；看板明早运。"}],
  ["L03",3,"聴解 問題1 課題理解 (3/5)","女の学生は提出前に何を直さなければなりませんか。",["アンケート結果の分析","レポートの文字数","参考文献の書き方","表紙のデザイン"],["老师表扬做得好","字数合乎规定","正解：ただね后唯一必改项","保持原样就行"],2,"校园反馈题紧盯转折词「ただね」。",{"intro":"大学で学生と先生がレポートの下書きについて話しています。","dlg":[["ナレーター","学生と先生がレポートについて話しています。提出前に何を直さなければなりませんか。"],["女","先生、下書きを見ていただけましたか。文字数も規定どおりにしました。"],["男","うん、アンケート分析もよかったよ。ただね、最後の参考文献の書き方が大学のルールと違っているから直しておいて。表紙はそのままでいいよ。"],["女","分かりました、すぐ直します。"]],"tr":"分析和字数都没问题，唯独参考文献格式不合校规要改，封面不动。"}],
  ["L04",3,"聴解 問題1 課題理解 (4/5)","女の人はこのあとまず何をしなければなりませんか。",["箱に入っていた用紙に記入する","ホームページから用紙をダウンロードして印刷する","送料を自分で払って返送する","Mサイズを新しく注文し直す"],["表格已被误扔","正解：客服给出的替代第一步","店家出运费(着払い)","收到退货会自动补发"],1,"原方案受阻→紧跟客服给出的新第一步操作。",{"intro":"ネット通販の客（女）と店（男）がサイズ交換の電話をしています。","dlg":[["ナレーター","客と店の担当者が電話しています。女の人はまず何をしなければなりませんか。"],["女","注文したMではなくLが届いたので交換したいんですが。"],["男","申し訳ございません。箱の返品用紙に記入して着払いで返送してください。"],["女","すみません、その用紙を捨ててしまったみたいで……。"],["男","では、当社ホームページから用紙をダウンロードして印刷し、ご記入ください。送料は着払いで結構です。"]],"tr":"随箱退货单被误扔，客服请她先从官网下载打印并填写，邮费到付。"}],
  ["L05",3,"聴解 問題1 課題理解 (5/5)","女の社員はこれからまず何をしますか。",["資料を2部追加コピーし、椅子を増やす","駅までお客さんを迎えに行く","応接室のお茶を用意する","受付の案内板を確認する"],["正解：客户临时多来2人最急","小李开车去接","女方已准备好","放后面就行"],0,"抓突发变化「予定より2人多く」「大急ぎで」。",{"intro":"会社で上司と部下が来客準備を話しています。","dlg":[["ナレーター","上司と部下が来客準備を話しています。女の社員はこれからまず何をしますか。"],["女","お茶は用意しました。駅へ迎えに行きましょうか。"],["男","迎えは李くんが車で行くよ。それより急にお客さんが2人増えたんだ。大急ぎで資料を2部追加コピーして椅子も2脚増やしてくれる？案内板の確認はそのあとでいいから。"],["女","承知しました、すぐやります！"]],"tr":"茶已备好、小李去接站；客户临时多2人，急需先补印2份资料加2把椅子。"}],
  ["L06",3,"聴解 問題2 ポイント理解 (1/6)","この図書館が一番人気を集めている理由は何ですか。",["市内でもっとも蔵書が多いから","駅から歩いて3分と近いから","会話できるカフェスペースがあるから","とても静かで勉強に集中できるから"],["次要优点","次要优点","正解：命中「何といっても利用者に好評なのは」","与原文打破安静印象相反"],2,"聴解問題2 必抓最高级信号词「何といっても」。",{"intro":"ラジオでアナウンサーが市民図書館を紹介しています。","dlg":[["ナレーター","アナウンサーが図書館について話しています。一番人気の理由は何ですか。"],["男","蔵書数の多さや駅徒歩3分の立地も魅力ですが、何といっても利用者に好評なのは、会話ができるカフェスペースを併設したことだそうです。従来の静かにすべきというイメージを変えました。"]],"tr":"藏书多和离站近只是铺垫，最受好评的是可聊天的咖啡空间。"}],
  ["L07",3,"聴解 問題2 ポイント理解 (2/6)","和菓子屋で若い客が増えた一番の理由は何ですか。",["値段を以前より安くしたから","食べやすい大きさと可愛い見た目を工夫したから","駅の近くに店を移転したから","テレビCMをたくさん流したから"],["店主明确否认降价","正解：单手小尺寸＋拍照好看走红SNS","明确否认搬店","非电视广告"],1,"抓「これが一番のきっかけですね」。",{"intro":"リポーターが老舗和菓子屋の店主にインタビューしています。","dlg":[["ナレーター","和菓子屋の店主に聞いています。若い客が増えた一番の理由は何ですか。"],["男","若い客が増えたそうですが、値下げや移転をしたんですか。"],["女","いえ、価格も場所も昔のままです。半年前に片手で食べられる小さなサイズにして色合いも可愛くしたら、写真映えするとSNSで広まりまして。これが一番のきっかけです。"]],"tr":"未降价未搬家，改为单手小尺寸＋高颜值在SNS走红。"}],
  ["L08",3,"聴解 問題2 ポイント理解 (3/6)","セルフレジ導入の一番の成果は何だと言っていますか。",["高齢者の利用が予想以上に増えたこと","人件費が大幅に削減できたこと","待ち時間が減って客の満足度が上がったこと","商品の値段を安くできたこと"],["开头仅说曾担心","仅說多少有点帮助","正解：命中「一番の成果は」","未提及降价"],2,"让步结构「もちろんAにも多少は～が、一番の成果はB」。",{"intro":"スーパーの店長がインタビューに答えています。","dlg":[["ナレーター","店長が話しています。セルフレジ導入の一番の成果は何ですか。"],["男","導入前は高齢者に敬遠されるか心配でしたが、夕方の待ち時間が大幅に減って大変喜ばれています。人件費削減にも多少は役立ちますが、一番の成果はお客様の満足度が上がったことですね。"]],"tr":"人工费仅多少有助，最大成果是排队缩短、顾客满意度上升。"}],
  ["L09",3,"聴解 問題2 ポイント理解 (4/6)","植物園の夜間イベントで来場者が増えた一番の理由は何ですか。",["入場料を昼間より安くしたから","今年から初めてライトアップを始めたから","昼間より涼しくて歩きやすいから","夜に咲く珍しい植物を専門家の解説付きで見られるから"],["与白天同价","去年就有了","未提及为主因","正解：今年首次策划大获好评"],3,"排除去年已有项，锁定「今年初めて～大好評」。",{"intro":"植物園の職員が夏の夜間公開について話しています。","dlg":[["ナレーター","植物園の職員に聞いています。来場者が増えた一番の理由は何ですか。"],["女","料金は昼間と同じでライトアップも去年からです。今年初めて、夜にだけ咲く珍しい熱帯植物を専門家の解説付きで回るツアーを企画したところ大好評でした。"]],"tr":"价格同白天、灯光秀去年就有，今年首推专家讲解夜开植物团爆火。"}],
  ["L10",3,"聴解 問題2 ポイント理解 (5/6)","この温泉旅館にリピーター（回头客）が多い一番の理由は何ですか。",["客の好みに合わせた手作りの周辺散歩マップを渡しているから","料理の品数が地域で最も多いから","宿泊料金が他の旅館の半額だから","最新の大きなプールを新設したから"],["正解：独一无二的贴心手绘地图","明确说并非豪华大餐","未提半价","未提泳池"],0,"抓「それより何より喜ばれているのが（比什么都受欢迎的是）」。",{"intro":"旅行番組で温泉旅館の女将（女）が話しています。","dlg":[["ナレーター","旅館の女将が話しています。リピーターが多い一番の理由は何ですか。"],["女","豪華な料理や安さで勝負しているわけではありません。それより何より喜ばれているのが、お客様の趣味に合わせてスタッフが一枚ずつ手書きする、地元の穴場散歩マップなんです。"]],"tr":"不靠豪华料理或低价，最受欢迎的是按客人喜好手绘的当地小众散步地图。"}],
  ["L11",3,"聴解 問題2 ポイント理解 (6/6)","男の社員が部署の異動を希望した本当の理由は何ですか。",["今の部署の給料が低すぎるから","専門資格を取るための勉強時間を確保したいから","上司と人間関係がうまくいかないから","海外支店で働いてみたいから"],["男方否认对待遇不满","正解：为备考专业资格减少加班","否认人际问题","未提海外"],1,"听清否定干扰项后的「実は～（其实真正原因是……）」。",{"intro":"職場で同僚の2人が話しています。","dlg":[["ナレーター","同僚2人が話しています。男の社員が異動を希望した本当の理由は何ですか。"],["女","今の部署、残業は多いけどやりがいあるし人間関係もいいよね。給料に不満があるの？"],["男","いや、待遇にも上司にも不満はないんだ。実は来年どうしても取りたい専門資格があって、残業の少ない部署に移って勉強時間を確保したいんだ。"]],"tr":"对工资上司都无不满，真正原因是想移到加班少的部门腾时间考专业资格。"}],
  ["L12",3,"聴解 問題3 概要理解 (1/5)","この専門家が最も伝えたいことは何ですか。",["休日にまとめて長く寝るべきだ。","休日も起床時間を大きく変えず、必要なら短い昼寝をとるとよい。","毎日昼間に1時間以上寝るのが効果的だ。","日曜の夜は遅く寝るべきだ。"],["被しかし否定的寝だめ","正解：精准命中「大切なのは」","原文为20分钟左右","无中生有"],1,"問題3 紧盯「しかし否定通念 → 大切なのは（主旨）」。",{"intro":"講演会で専門家が睡眠について話しています。","dlg":[["ナレーター","専門家が話しています。最も伝えたいことは何ですか。"],["女","休日の寝だめで3時間以上遅く起きると体内時計が乱れます。大切なのは、休日も起床時間を大きく変えず、眠いときは昼間に20分程度の短い昼寝をとることなのです。"]],"tr":"周末晚起补觉会乱生物钟，应保持起床时间稳定、困了白天小睡20分钟。"}],

const tts = { playingId: null, rate: 1.0, showScript: {}, voices: [] };
function loadVoices() {
  if ('speechSynthesis' in window) tts.voices = (speechSynthesis.getVoices() || []).filter(v => (v.lang || '').toLowerCase().startsWith('ja'));
}
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function stopAudio(rerender = false) {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  tts.playingId = null;
  if (rerender) render();
}
function playAudio(qId) {
  if (tts.playingId === qId) return stopAudio(true);
  const q = QUESTIONS.find(x => x.id === qId);
  if (!q || !q.audio) return;
  if (!('speechSynthesis' in window)) return alert('请用手机 Safari / Chrome 打开本网页以播放日语听力');
  stopAudio(false); loadVoices();
  tts.playingId = qId; render();
  speakStep(q, 0);
}
function speakStep(q, i) {
  if (tts.playingId !== q.id) return;
  if (i >= q.audio.dlg.length) { tts.playingId = null; render(); return; }
  const [sp, text] = q.audio.dlg[i];
  const el = document.getElementById('aud-st-' + q.id);
  if (el) el.textContent = `正在朗读 (${i+1}/${q.audio.dlg.length})：${sp}`;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP'; u.rate = tts.rate;
  if (tts.voices.length) u.voice = tts.voices[0];
  u.pitch = sp === '男' ? 0.85 : (sp === '女' ? 1.15 : 1.0);
  u.onend = () => { if (tts.playingId === q.id) setTimeout(() => speakStep(q, i + 1), 350); };
  u.onerror = () => stopAudio(true);
  speechSynthesis.speak(u);
}
function setRate(r) { tts.rate = r; const id = tts.playingId; if (id) { stopAudio(false); playAudio(id); } else render(); }
function toggleScript(id) { tts.showScript[id] = !tts.showScript[id]; render(); }

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmtT = s => `${String(Math.floor(Math.max(0,s)/60)).padStart(2,'0')}:${String(Math.max(0,s)%60).padStart(2,'0')}`;
const getCefr = (sc, ok) => !ok ? '未达合格线' : (sc >= 112 ? 'CEFR B2' : 'CEFR B1');

function startMode(modeKey) {
  stopAudio(false);
  let qs = QUESTIONS, title = '2026.12 正规101题全真模拟考（全4科）', mins = 155;
  if (modeKey === 'sec0') { qs = QUESTIONS.filter(q => q.secIdx === 0); title = '专项刷题：文字・語彙（完整30题）'; mins = 30; }
  else if (modeKey === 'sec1') { qs = QUESTIONS.filter(q => q.secIdx === 1); title = '专项刷题：文法（完整22题）'; mins = 25; }
  else if (modeKey === 'sec2') { qs = QUESTIONS.filter(q => q.secIdx === 2); title = '专项刷题：読解（完整19题）'; mins = 50; }
  else if (modeKey === 'sec3') { qs = QUESTIONS.filter(q => q.secIdx === 3); title = '专项刷题：聴解（完整30题🎧）'; mins = 50; }
  else if (modeKey === 'retry') {
    const ids = Object.keys(st.mistakes).filter(k => !st.mistakes[k].mastered);
    if (!ids.length) return alert('当前没有待攻克错题！');
    qs = QUESTIONS.filter(q => ids.includes(q.id));
    title = `错题专项重刷（${qs.length}题）`; mins = Math.max(10, qs.length * 2);
  }
  launchQuiz(modeKey, title, qs, mins);
}

function launchQuiz(modeKey, title, qs, mins) {
  if (st.quiz?.tid) clearInterval(st.quiz.tid);
  st.quiz = { modeKey, title, qs, idx: 0, ans: {}, rem: mins * 60, total: mins * 60, tid: null };
  st.quiz.tid = setInterval(() => {
    if (!st.quiz) return;
    st.quiz.rem--;
    const el = document.getElementById('q-timer'); if (el) el.textContent = fmtT(st.quiz.rem);
    if (st.quiz.rem <= 0) submitQuiz();
  }, 1000);
  st.view = 'quiz'; render(); window.scrollTo(0,0);
}

          ${renderAudioBox(q, false)}
          ${q.passage ? `<div class="jp p-3.5 sm:p-4 rounded-xl bg-amber-50/70 border border-amber-200 text-sm whitespace-pre-line">${q.passage}</div>` : ''}
          <div class="jp text-base sm:text-lg font-semibold text-slate-900">${q.stem}</div>

          <div class="space-y-2.5">
            ${q.options.map((opt, i) => `
              <button type="button" onclick="pickAns('${q.id}',${i})" class="w-full min-h-[52px] text-left p-3.5 rounded-xl border-2 flex items-start gap-3 transition ${uAns===i ? 'border-indigo-600 bg-indigo-50/80 shadow-sm' : 'border-slate-200 hover:border-indigo-300'}">
                <span class="w-7 h-7 shrink-0 rounded-full flex items-center justify-center text-sm font-bold ${uAns===i ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-700'}">${i+1}</span>
                <span class="jp text-sm sm:text-base pt-0.5">${opt}</span>
              </button>`).join('')}
          </div>

          <div class="flex justify-between pt-4 border-t border-slate-100">
            <button type="button" onclick="jumpQ(${qz.idx-1})" ${qz.idx===0?'disabled':''} class="px-4 py-2.5 rounded-xl border border-slate-300 text-sm disabled:opacity-40">← 上一题</button>
            ${qz.idx === qz.qs.length - 1
              ? `<button type="button" onclick="confirmSubmit()" class="px-5 py-2.5 rounded-xl bg-emerald-600 text-white text-sm font-bold shadow">交卷并评分 ✓</button>`
              : `<button type="button" onclick="jumpQ(${qz.idx+1})" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-bold">下一题 →</button>`}
          </div>
        </div>

        <aside class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-4 shadow-sm h-fit">
          <div class="flex items-center justify-between mb-2.5">
            <span class="font-bold text-xs text-slate-800">快速跳题卡（共 ${qz.qs.length} 题）</span>
            <span class="text-[11px] text-slate-400">🟦已答 ⬜未答</span>
          </div>
          <div class="grid grid-cols-7 sm:grid-cols-10 lg:grid-cols-6 gap-1.5 max-h-64 overflow-y-auto p-0.5">
            ${qz.qs.map((item, i) => {
              const cur = i === qz.idx, ok = qz.ans[item.id] !== undefined;
              return `<button type="button" onclick="jumpQ(${i})" class="h-8 rounded-lg text-xs font-semibold border ${ok ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-slate-50 text-slate-600 border-slate-200'} ${cur ? 'ring-2 ring-rose-500 ring-offset-1' : ''}">${i+1}</button>`;
            }).join('')}
          </div>
        </aside>
      </div>
    </div>`;
}

function pickAns(id, i) { if (st.quiz) { st.quiz.ans[id] = i; render(); } }
function jumpQ(i) { if (st.quiz && i >= 0 && i < st.quiz.qs.length) { stopAudio(false); st.quiz.idx = i; render(); window.scrollTo(0,0); } }
function confirmSubmit() {
  const qz = st.quiz; if (!qz) return;
  const un = qz.qs.length - Object.keys(qz.ans).length;
  if (un > 0 && !confirm(`还有 ${un} 道题未作答，未答题目将计为错题并展示全部选项知识点。确定交卷吗？`)) return;
  submitQuiz();
}

function submitQuiz() {
  stopAudio(false);
  const qz = st.quiz; if (!qz) return;
  if (qz.tid) clearInterval(qz.tid);

  const major = { lang:{c:0,t:0}, read:{c:0,t:0}, listen:{c:0,t:0} };
  let okCnt = 0; const items = [], wrongs = [];

  qz.qs.forEach((q, idx) => {
    const u = qz.ans[q.id], ok = u === q.answer;
    if (ok) okCnt++;
    const mk = q.secIdx <= 1 ? 'lang' : (q.secIdx === 2 ? 'read' : 'listen');
    major[mk].t++; if (ok) major[mk].c++;
    const rec = { q, num: idx + 1, u, ok };
    items.push(rec);
    if (!ok) {
      wrongs.push(rec);
      const prev = st.mistakes[q.id];
      st.mistakes[q.id] = { id: q.id, u, cnt: prev ? prev.cnt + 1 : 1, mastered: false, at: Date.now() };
    } else if (qz.modeKey === 'retry' && st.mistakes[q.id]) {
      st.mistakes[q.id].mastered = true;
    }
  });

  const rate = qz.qs.length ? okCnt / qz.qs.length : 0;
  const lang = major.lang.t ? Math.round((major.lang.c / major.lang.t) * 60) : Math.round(rate * 60);
  const read = major.read.t ? Math.round((major.read.c / major.read.t) * 60) : Math.round(rate * 60);
  const listen = major.listen.t ? Math.round((major.listen.c / major.listen.t) * 60) : Math.round(rate * 60);
  const total = lang + read + listen;
  const passed = total >= 90 && lang >= 19 && read >= 19 && listen >= 19;

  st.history[qz.modeKey] = { ok: okCnt, tot: qz.qs.length, acc: Math.round(rate * 100), total };
  saveLS(KEY_M, st.mistakes); saveLS(KEY_H, st.history);

  st.result = { title: qz.title, okCnt, tot: qz.qs.length, acc: Math.round(rate * 100), lang, read, listen, total, passed, cefr: getCefr(total, passed), items, wrongs, used: qz.total - qz.rem };
  st.resFilter = wrongs.length ? 'wrong' : 'all';
  st.quiz = null; st.view = 'result'; render(); window.scrollTo(0,0);
}

function renderDetailCard(q, numLabel, uAns, isOk, mCtrl = false) {
  return `
    <article class="bg-white rounded-2xl border-2 ${isOk ? 'border-emerald-200' : 'border-rose-200'} shadow-sm overflow-hidden">
      <div class="px-4 py-2.5 flex flex-wrap items-center justify-between gap-2 text-xs ${isOk ? 'bg-emerald-50/70' : 'bg-rose-50/70'} border-b border-slate-100">
        <div><span class="px-2 py-0.5 rounded font-bold text-white ${isOk?'bg-emerald-600':'bg-rose-600'}">${esc(numLabel)}</span> <strong class="text-slate-800">${esc(q.section)} · ${esc(q.qType)}</strong></div>
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="px-2 py-0.5 rounded font-bold ${isOk?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}">你选：${uAns===undefined?'未答':`选项${uAns+1}`}</span>
          <span class="px-2 py-0.5 rounded bg-emerald-600 text-white font-bold">正解：选项${q.answer+1}</span>
          ${mCtrl ? `<button type="button" onclick="toggleM('${q.id}')" class="px-2 py-0.5 rounded border bg-white font-semibold">${st.mistakes[q.id]?.mastered?'✓已掌握':'标掌握'}</button><button type="button" onclick="delM('${q.id}')" class="text-slate-400">删</button>` : ''}
        </div>
      </div>
      <div class="p-4 space-y-3">
        ${renderAudioBox(q, true)}
        ${q.passage ? `<div class="jp p-3 rounded-xl bg-amber-50/60 border border-amber-200 text-xs sm:text-sm whitespace-pre-line">${q.passage}</div>` : ''}
        <div class="jp font-semibold text-slate-900">${q.stem}</div>
        <div>
          <div class="text-xs font-bold text-indigo-700 mb-2">📘 每个选项的知识点逐一拆解</div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
            ${q.options.map((opt, idx) => {
              const isA = idx === q.answer, isW = !isA && idx === uAns;
              return `
                <div class="p-3 rounded-xl border ${isA?'border-emerald-400 bg-emerald-50/70':(isW?'border-rose-400 bg-rose-50/70':'border-slate-200 bg-slate-50/60')}">
                  <div class="flex items-start justify-between gap-2 mb-1">
                    <span class="jp font-bold text-sm">${idx+1}. ${opt}</span>
                    <span class="px-1.5 py-0.5 rounded text-[10px] font-bold shrink-0 ${isA?'bg-emerald-600 text-white':(isW?'bg-rose-600 text-white':'bg-slate-200 text-slate-600')}">${isA?'✓正解':(isW?'✗误选':'干扰项')}</span>
                  </div>
                  <div class="text-xs text-slate-700 leading-relaxed">${esc(q.kps[idx] || '')}</div>
                </div>`;
            }).join('')}
          </div>
        </div>
        <div class="p-3 rounded-xl bg-indigo-50/70 text-xs text-slate-800"><strong>💡 考场解题精要：</strong>${esc(q.exp)}</div>
      </div>
    </article>`;
}

function viewResult() {
  const r = st.result; const list = st.resFilter === 'wrong' ? r.wrongs : r.items;
  return `
    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex items-center gap-4">
          <div class="w-24 h-24 rounded-full border-8 flex flex-col items-center justify-center shrink-0 ${r.passed?'border-emerald-500 bg-emerald-50 text-emerald-800':'border-rose-500 bg-rose-50 text-rose-800'}">
            <div class="text-2xl font-extrabold">${r.total}</div><div class="text-[11px]">/180分</div>
          </div>
          <div>
            <div class="flex flex-wrap gap-1.5 mb-1">
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${r.passed?'bg-emerald-100 text-emerald-800':'bg-rose-100 text-rose-800'}">${r.passed?'✓ 预计合格 (≥90且单项≥19)':'✗ 暂未达标'}</span>
              <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-100 text-indigo-800">${r.cefr}</span>
            </div>
            <h2 class="font-bold text-slate-900">${esc(r.title)}</h2>
            <p class="text-xs text-slate-600 mt-0.5">对 ${r.okCnt}/${r.tot}（${r.acc}%）· 错 <strong class="text-rose-600">${r.wrongs.length}</strong> 题 · 言語${r.lang}/読解${r.read}/聴解${r.listen} · 用时 ${fmtT(r.used)}</p>
          </div>
        </div>
        <div class="flex flex-wrap gap-2">
          ${r.wrongs.length ? `<button type="button" onclick="startMode('retry')" class="px-3.5 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold">🔥 重刷错题</button>` : ''}
          <button type="button" onclick="goHome()" class="px-3.5 py-2 rounded-xl border border-slate-300 text-xs font-semibold">返回首页</button>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 bg-white rounded-xl border border-slate-200 p-3.5">
        <h3 class="font-bold text-sm sm:text-base">🔍 ${st.resFilter==='wrong' ? `本次错题全清单 & 逐项知识点拆解（${r.wrongs.length}题）` : `全部题目与知识点（${r.items.length}题）`}</h3>
        <div class="flex gap-1.5 text-xs">
          <button type="button" onclick="st.resFilter='wrong';render()" class="px-3 py-1.5 rounded-lg font-bold ${st.resFilter==='wrong'?'bg-rose-600 text-white':'bg-slate-100'}">仅看错题(${r.wrongs.length})</button>
          <button type="button" onclick="st.resFilter='all';render()" class="px-3 py-1.5 rounded-lg font-bold ${st.resFilter==='all'?'bg-indigo-600 text-white':'bg-slate-100'}">查看全部(${r.items.length})</button>
        </div>
      </div>

      ${list.length ? `<div class="space-y-4">${list.map(i => renderDetailCard(i.q, `第 ${i.num} 题`, i.u, i.ok, false)).join('')}</div>`
        : `<div class="bg-emerald-50 border border-emerald-200 rounded-2xl p-8 text-center font-bold text-emerald-800">🏆 全卷零失误！可点上方「查看全部」复习所有选项知识点。</div>`}
    </div>`;
}

function viewMistakes() {
  const all = Object.values(st.mistakes).sort((a,b) => (b.at||0)-(a.at||0));
  const unm = all.filter(x => !x.mastered);
  const shown = all.filter(x => {
    const q = QUESTIONS.find(qq => qq.id === x.id);
    return q && (st.mFilter === 'ALL' || q.section === st.mFilter);
  });
  return `
    <div class="space-y-4">
      <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm flex flex-wrap items-center justify-between gap-2">
        <div>
          <h2 class="text-lg font-bold text-slate-900">📕 智能错题集（含听力回放 · 逐项知识点）</h2>
          <p class="text-xs text-slate-500">累计 ${all.length} 题 · 待攻克 <strong class="text-rose-600">${unm.length}</strong> 题</p>
        </div>
        <button type="button" onclick="startMode('retry')" ${!unm.length?'disabled':''} class="px-4 py-2 rounded-xl bg-rose-600 disabled:bg-slate-300 text-white text-xs sm:text-sm font-bold">🔥 错题专项重刷 (${unm.length}题)</button>
      </div>
      <div class="flex flex-wrap gap-1.5 text-xs">
        ${['ALL', ...SECS].map(s => `<button type="button" onclick="st.mFilter='${s}';render()" class="px-3 py-1.5 rounded-lg font-semibold ${st.mFilter===s?'bg-indigo-600 text-white':'bg-white border border-slate-200 text-slate-600'}">${s==='ALL'?'全部分类':s}</button>`).join('')}
      </div>
      ${shown.length ? `<div class="space-y-4">${shown.map((m, i) => {
        const q = QUESTIONS.find(qq => qq.id === m.id);
        return renderDetailCard(q, `错题 #${i+1}`, m.u, false, true);
      }).join('')}</div>` : `<div class="bg-white rounded-2xl border border-slate-200 p-10 text-center text-sm text-slate-500">暂无错题记录。</div>`}
    </div>`;
}

function toggleM(id) { if (st.mistakes[id]) { st.mistakes[id].mastered = !st.mistakes[id].mastered; saveLS(KEY_M, st.mistakes); render(); } }
function delM(id) { delete st.mistakes[id]; saveLS(KEY_M, st.mistakes); render(); }

render();
</script>
</body>
